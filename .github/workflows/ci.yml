name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only checks out and tests — it never writes to the
# repo, so the GITHUB_TOKEN needs read-only contents (CodeQL hardening).
permissions:
  contents: read

jobs:
  backend:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # 3.10 = supported floor, 3.14 = latest; the floor catches accidental
        # use of newer-Python stdlib features outside a version guard
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Sync deps
        run: uv sync --group dev
      # Lint + type-check ONCE, pinned to 3.13: matches local dev, and the
      # numpy stubs are known-good there. They are OS-independent, and mypy
      # against the floor's older numpy stubs (numpy 2.2 on 3.10) reports
      # stub-version differences, not real issues.
      - name: Lint
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: uv run ruff check src tests tools
      - name: Type check
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: uv run mypy src tools
      - name: Tests
        # realdata/oracle tests skip in CI (the private instrument corpus is
        # absent there — see tests/conftest.py's EXAMPLE_DATA_ROOT). A full
        # local run WITH that corpus checked out currently reads ~93.8%
        # coverage (1808 tests); CI never sees that corpus, so its own
        # number runs lower and is not the right basis for this gate either
        # way. The gate stays pinned at 82 with headroom for normal churn —
        # do not raise it from a local coverage reading.
        run: uv run pytest -v --cov=fermiviewer --cov-report=term-missing --cov-fail-under=82

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # single source of truth: .nvmrc at the repo root (volta pins the
          # exact patch in frontend/package.json; engines there must agree)
          node-version-file: .nvmrc
      - name: Install
        run: npm ci
      - name: Unit tests (vitest)
        run: npm test
      - name: Build (includes typecheck)
        run: npm run build
