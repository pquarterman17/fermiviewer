name: Instrument corpus

# The realdata and oracle tests skip in ordinary CI: the instrument corpus
# lives in the private pquarterman17/test-data repo, and the rosettasciio
# oracle is a GPL dev-only group. This runs both weekly (and on demand)
# against that corpus, so parser drift on genuine vendor files shows up
# without anyone remembering to run them locally.
#
# Needs a repository secret TEST_DATA_TOKEN: a fine-grained token with
# read-only Contents access to pquarterman17/test-data. Without it the job
# fails: a green run that tested nothing would hide the lost coverage.

on:
  schedule:
    - cron: "17 6 * * 1"     # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  corpus:
    runs-on: ubuntu-latest
    steps:
      - name: Check for the corpus token
        env:
          TOKEN: ${{ secrets.TEST_DATA_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::TEST_DATA_TOKEN is not set (or is empty); the corpus cannot be checked out"
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: pquarterman17/test-data
          token: ${{ secrets.TEST_DATA_TOKEN }}
          path: test-data
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
      - name: Sync deps (with the oracle group)
        run: uv sync --group dev --group oracle
      - name: Realdata and oracle tests
        env:
          FV_TEST_DATA: ${{ github.workspace }}/test-data
        run: uv run pytest -v -rs -m "realdata or oracle"
